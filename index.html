<!-- SECTION DÉPÔT - REMPLACER UNIQUEMENT CETTE PARTIE -->
<!-- À partir de la ligne 1125 -->

<div class="screen" id="screen-depot">

  <div class="role-select">
    <button class="role-btn selected" id="depot-role-travailleur-btn" onclick="setDepotRole('travailleur')" data-i18n="btn_role_travailleur">👷 Travailleur</button>
    <button class="role-btn" id="depot-role-patron-btn" onclick="setDepotRole('patron')" data-i18n="btn_role_patron">🧑‍💼 Patron</button>
  </div>

  <!-- DÉPÔT TRAVAILLEUR -->
  <div class="card" id="depot-travailleur">
    <h2>📦 Déposer mon dossier</h2>
    
    <label>Type de travail recherché</label>
    <button type="button" class="job-picker-btn" id="btn-depot-t-type" onclick="ouvrirSelecteurTravail('depot-t-type','depot-t-poste','btn-depot-t-type')">-- Choisir un type de travail --</button>
    <input type="hidden" id="depot-t-type" value="">
    <input type="hidden" id="depot-t-poste" value="">

    <label>Pays recherché</label>
    <button type="button" class="country-picker-btn" id="btn-depot-t-pays" onclick="ouvrirSelecteurPays('depot-t-pays','btn-depot-t-pays')">-- Choisir un pays --</button>
    <input type="hidden" id="depot-t-pays" value="">

    <p class="dossier-note">Uploadez votre dossier de candidature (PDF ou image) :</p>
    <div id="depot-t-documents-list"></div>

    <!-- NUMÉROS WHATSAPP EN BAS (APRÈS REMPLISSAGE) -->
    <div id="depot-t-whatsapp-section" style="margin-top: 20px; display: none;">
      <label style="font-weight: 700; color: #0E6E46; margin-bottom: 12px; display: block;">📱 Envoyer directement via WhatsApp :</label>
      <div id="depot-t-whatsapp-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <!-- Ancienne zone masquée -->
    <input type="hidden" id="depot-t-patron-tel" value="">

    <button type="button" class="submit-btn" onclick="window.deposerTravailleur()">✅ Déposer mon dossier</button>
    <div class="msg" id="depot-t-msg"></div>
  </div>

  <!-- DÉPÔT PATRON -->
  <div class="card" id="depot-patron" style="display:none;">
    <h2>📦 Publier une offre</h2>
    
    <label>Type de poste</label>
    <button type="button" class="job-picker-btn" id="btn-depot-p-type" onclick="ouvrirSelecteurTravail('depot-p-type','depot-p-poste','btn-depot-p-type')">-- Choisir un type de travail --</button>
    <input type="hidden" id="depot-p-type" value="">
    <input type="hidden" id="depot-p-poste" value="">

    <label>Pays où recruter</label>
    <button type="button" class="country-picker-btn" id="btn-depot-p-pays" onclick="ouvrirSelecteurPays('depot-p-pays','btn-depot-p-pays')">-- Choisir un pays --</button>
    <input type="hidden" id="depot-p-pays" value="">

    <p class="dossier-note">Cochez les critères que vous exigez :</p>
    <div id="depot-p-criteres-list"></div>

    <!-- NUMÉROS WHATSAPP EN BAS (APRÈS REMPLISSAGE) -->
    <div id="depot-p-whatsapp-section" style="margin-top: 20px; display: none;">
      <label style="font-weight: 700; color: #0E6E46; margin-bottom: 12px; display: block;">📱 Envoyer directement via WhatsApp :</label>
      <div id="depot-p-whatsapp-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <!-- Ancienne zone masquée -->
    <input type="hidden" id="depot-p-travailleur-tel" value="">

    <button type="button" class="submit-btn" onclick="window.deposerPatron()">✅ Publier l'offre</button>
    <div class="msg" id="depot-p-msg"></div>
  </div>
</div>

<!-- STYLES POUR LES BOUTONS WHATSAPP EN BAS -->
<style>
  .whatsapp-bottom-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: #E7F2E9;
    border: 2px solid #0E6E46;
    border-radius: 10px;
    color: #0E6E46;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .whatsapp-bottom-btn:active {
    background: #0E6E46;
    color: white;
    transform: scale(0.98);
  }
  .whatsapp-patron-name {
    flex: 1;
    font-size: 0.9rem;
  }
  .whatsapp-icon {
    font-size: 1.2rem;
  }
</style>

<!-- JAVASCRIPT - À REMPLACER DANS LE SCRIPT EXISTANT -->
<!-- Remplacer updateDossierTravailleurDepotUI et updateDossierPatronDepotUI et chargerPatronsDepot/chargerTravailleursDepot -->

<script>
  window.updateDossierTravailleurDepotUI = function () {
    const catId = document.getElementById("depot-t-type").value;
    const poste = document.getElementById("depot-t-poste").value;
    if (!catId) return;
    const config = getDossierConfig(catId, poste);
    document.getElementById("depot-t-documents-list").innerHTML = config.documents.map(d => `
      <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: normal;">
        <span style="font-weight: 600; flex: 1;">${esc(d.label)}${d.requis ? " *" : ""}</span>
      </label>
      <input type="file" class="t-doc-input" data-doc-key="${d.key}" data-doc-requis="${d.requis}" accept="image/*,.pdf" style="margin-bottom: 14px;">
    `).join("");
    
    // Charger les patrons après documents
    window.chargerPatronsDepotNew();
  };

  // ===== Charger les patrons disponibles pour les travailleurs (VERSION MODIFIÉE) =====
  window.chargerPatronsDepotNew = async function() {
    const typeTravail = document.getElementById("depot-t-type").value;
    const pays = document.getElementById("depot-t-pays").value;
    
    if (!typeTravail || !pays) {
      document.getElementById("depot-t-whatsapp-section").style.display = "none";
      return;
    }

    try {
      const q = query(collection(db, "patrons"), 
        where("typeTravail", "==", typeTravail),
        where("pays", "==", pays)
      );
      const snap = await getDocs(q);
      
      if (snap.empty) {
        document.getElementById("depot-t-whatsapp-section").style.display = "none";
        return;
      }

      const patrons = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      
      document.getElementById("depot-t-whatsapp-list").innerHTML = patrons.map(p => `
        <a class="whatsapp-bottom-btn" href="https://wa.me/${p.telephone ? p.telephone.replace(/[^0-9]/g, '') : ''}" target="_blank" onclick="window.ouvrirWhatsappTravailleur(event, '${esc(p.telephone)}', '${esc(p.nom || 'Patron')}')">
          <span class="whatsapp-icon">💬</span>
          <span class="whatsapp-patron-name">${esc(p.nom || 'Patron')} - ${esc(p.telephone || 'Sans numéro')}</span>
          <span style="font-size: 1.1rem;">→</span>
        </a>
      `).join("");
      
      document.getElementById("depot-t-whatsapp-section").style.display = "block";
      
      // Scroll vers les numéros WhatsApp
      setTimeout(() => {
        document.getElementById("depot-t-whatsapp-section").scrollIntoView({ behavior: "smooth" });
      }, 300);
      
    } catch (e) {
      console.error("Erreur chargement patrons:", e);
      document.getElementById("depot-t-whatsapp-section").style.display = "none";
    }
  };

  window.ouvrirWhatsappTravailleur = async function(event, tel, nom) {
    event.preventDefault();
    
    // Valider et soumettre le formulaire
    const typeTravail = document.getElementById("depot-t-type").value;
    const pays = document.getElementById("depot-t-pays").value;
    
    if (!typeTravail || !pays) {
      showMsg("depot-t-msg", false, "", "Veuillez sélectionner un type de travail et un pays.");
      return;
    }
    
    const user = auth.currentUser;
    if (!user) {
      showMsg("depot-t-msg", false, "", "Vous devez être connecté pour déposer un dossier.");
      return;
    }
    
    try {
      // Remplir le champ caché
      document.getElementById("depot-t-patron-tel").value = tel;
      
      // Soumettre le formulaire
      await window.deposerTravailleur();
      
    } catch (e) {
      console.error("Erreur:", e);
    }
  };

  // ===== Mettre à jour UI Patron (VERSION MODIFIÉE) =====
  window.updateDossierPatronDepotUI = function () {
    const catId = document.getElementById("depot-p-type").value;
    const poste = document.getElementById("depot-p-poste").value;
    if (!catId) return;
    const config = getDossierConfig(catId, poste);
    document.getElementById("depot-p-criteres-list").innerHTML = config.criteres.map(c => `
      <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: normal;">
        <input type="checkbox" value="${esc(c)}" style="width: 18px; height: 18px; accent-color: #0E6E46;">
        <span style="flex: 1;">${esc(c)}</span>
      </label>
    `).join("");
    
    // Charger les travailleurs après critères
    window.chargerTravailleursDepotNew();
  };

  // ===== Charger les travailleurs disponibles pour les patrons (VERSION MODIFIÉE) =====
  window.chargerTravailleursDepotNew = async function() {
    const typeTravail = document.getElementById("depot-p-type").value;
    const pays = document.getElementById("depot-p-pays").value;
    
    if (!typeTravail || !pays) {
      document.getElementById("depot-p-whatsapp-section").style.display = "none";
      return;
    }

    try {
      const q = query(collection(db, "travailleurs"), 
        where("typeTravail", "==", typeTravail),
        where("pays", "==", pays)
      );
      const snap = await getDocs(q);
      
      if (snap.empty) {
        document.getElementById("depot-p-whatsapp-section").style.display = "none";
        return;
      }

      const travailleurs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      
      document.getElementById("depot-p-whatsapp-list").innerHTML = travailleurs.map(t => `
        <a class="whatsapp-bottom-btn" href="https://wa.me/${t.telephone ? t.telephone.replace(/[^0-9]/g, '') : ''}" target="_blank" onclick="window.ouvrirWhatsappPatron(event, '${esc(t.telephone)}', '${esc(t.nom || 'Travailleur')}')">
          <span class="whatsapp-icon">💬</span>
          <span class="whatsapp-patron-name">${esc(t.nom || 'Travailleur')} - ${esc(t.telephone || 'Sans numéro')}</span>
          <span style="font-size: 1.1rem;">→</span>
        </a>
      `).join("");
      
      document.getElementById("depot-p-whatsapp-section").style.display = "block";
      
      // Scroll vers les numéros WhatsApp
      setTimeout(() => {
        document.getElementById("depot-p-whatsapp-section").scrollIntoView({ behavior: "smooth" });
      }, 300);
      
    } catch (e) {
      console.error("Erreur chargement travailleurs:", e);
      document.getElementById("depot-p-whatsapp-section").style.display = "none";
    }
  };

  window.ouvrirWhatsappPatron = async function(event, tel, nom) {
    event.preventDefault();
    
    // Valider et soumettre le formulaire
    const typeTravail = document.getElementById("depot-p-type").value;
    const pays = document.getElementById("depot-p-pays").value;
    
    if (!typeTravail || !pays) {
      showMsg("depot-p-msg", false, "", "Veuillez sélectionner un type de travail et un pays.");
      return;
    }
    
    const user = auth.currentUser;
    if (!user) {
      showMsg("depot-p-msg", false, "", "Vous devez être connecté pour publier une offre.");
      return;
    }
    
    try {
      // Remplir le champ caché
      document.getElementById("depot-p-travailleur-tel").value = tel;
      
      // Soumettre le formulaire
      await window.deposerPatron();
      
    } catch (e) {
      console.error("Erreur:", e);
    }
  };

  // Fonction pour rafraîchir quand le pays ou type de travail change
  window.onDepotCountryOrTypeChange = function() {
    window.chargerPatronsDepotNew();
    window.chargerTravailleursDepotNew();
  };
</script>
