<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#073C28">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JOB CONNECT - Trouvez un travail, trouvez un travailleur, partout dans le monde</title>
<meta name="description" content="JOB CONNECT met en relation travailleurs et employeurs en Afrique centrale et partout dans le monde. Inscrivez-vous gratuitement pour trouver un emploi ou un travailleur qualifié.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2312805A'/%3E%3Cstop offset='100%25' stop-color='%23073C28'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-family='Georgia, serif' font-size='50' font-weight='700' fill='%23FFFFFF' text-anchor='middle'%3EJC%3C/text%3E%3Ccircle cx='78' cy='24' r='7' fill='%23E8A33D'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #FAF6EF;
    color: #1C2620;
    padding-bottom: 40px;
  }
  header {
    position: relative;
    background: #0E6E46;
    color: white;
    padding: 22px 16px 18px;
    text-align: center;
  }
  header .brandmark {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    height: 50px;
    margin-bottom: 6px;
    border-radius: 50%;
  }
  header h1 {
    position: relative;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
  }
  header p { position: relative; font-size: 0.82rem; opacity: 0.9; letter-spacing: 0.2px; }

  .signature-divider {
    height: 3px;
    background-color: #E8A33D;
  }

  .tabs {
    display: flex;
    background: white;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    padding: 6px 6px 0;
    gap: 4px;
  }
  .tab-btn {
    position: relative;
    flex: 1;
    padding: 12px 4px;
    text-align: center;
    background: none;
    border: none;
    border-radius: 10px 10px 0 0;
    font-size: 0.95rem;
    font-weight: 600;
    color: #6B7A72;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active {
    color: #0E6E46;
    background: #E7F2E9;
    border-bottom: 3px solid #0E6E46;
  }

  .screen { display: none; padding: 16px; max-width: 520px; margin: 0 auto; }
  .screen.active { display: block; }

  .card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 4px 14px rgba(7,60,40,0.08);
    margin-bottom: 16px;
    border-top: 3px solid #E8A33D;
  }
  .card h2 {
    font-size: 1.15rem;
    font-weight: 800;
    margin-bottom: 14px;
    color: #073C28;
    letter-spacing: 0.3px;
    padding-bottom: 8px;
    border-bottom: 2px solid #E7F2E9;
  }

  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: #555;
    margin: 12px 0 5px;
  }
  input, select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.95rem;
    background: #fafafa;
  }
  input:focus, select:focus { outline: none; border-color: #0E6E46; background: white; }

  .submit-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #0E6E46;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .submit-btn:active { background: #073C28; }
  .submit-btn:disabled { background: #9FC2AC; cursor: not-allowed; }

  .msg {
    margin-top: 14px;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    display: none;
  }
  .msg.success { background: #E7F2E9; color: #073C28; display: block; }
  .msg.error { background: #F7E6E2; color: #B33F2E; display: block; }

  .hamburger-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
  }

  .settings-menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .settings-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 14px 12px;
    border-radius: 10px;
    background: #FAF6EF;
    border: 1px solid #eee;
    font-size: 0.95rem;
    font-weight: 600;
    color: #1C2620;
    text-decoration: none;
    cursor: pointer;
  }
  .settings-item:active { background: #E7F2E9; }
  .settings-item-value { color: #6B7A72; font-weight: 500; font-size: 0.85rem; }

  .country-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: flex-end;
  }
  .country-modal-overlay.open { display: flex; }
  .country-modal {
    background: white;
    width: 100%;
    max-height: 75vh;
    border-radius: 18px 18px 0 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .country-modal-close {
    margin-top: 12px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #eee;
    color: #444;
    font-weight: 700;
    cursor: pointer;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-content {
    background: white;
    border-radius: 16px;
    padding: 24px;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 1.8rem;
    cursor: pointer;
    color: #999;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:active { color: #333; }

  .signal-reason-btn {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: white;
    font-size: 0.9rem;
    font-weight: 600;
    color: #333;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
  }
  .signal-reason-btn:active {
    border-color: #B33F2E;
    background: #F7E6E2;
    color: #B33F2E;
  }
  .signal-reason-btn.selected {
    border-color: #B33F2E;
    background: #F7E6E2;
    color: #B33F2E;
  }

  .annonce-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    border-left: 4px solid #0E6E46;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .annonce-card h3 {
    font-size: 1rem;
    font-weight: 700;
    color: #073C28;
    margin-bottom: 8px;
  }
  .annonce-card p {
    font-size: 0.85rem;
    color: #666;
    margin: 6px 0;
  }
  .annonce-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .annonce-btn {
    flex: 1;
    min-width: 80px;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .annonce-btn-contact {
    background: #E7F2E9;
    color: #0E6E46;
  }
  .annonce-btn-signaler {
    background: #F7E6E2;
    color: #B33F2E;
  }

  .empty-state {
    text-align: center;
    color: #999;
    padding: 40px 20px;
    font-size: 0.95rem;
  }

  textarea {
    width: 100%;
    min-height: 80px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #0E6E46; background: white; }
</style>
</head>
<body>

<header>
  <div class="brandmark">
    <svg viewBox="0 0 100 100" width="100%" height="100%">
      <circle cx="50" cy="50" r="48" fill="rgba(255,255,255,0.14)" stroke="#E8A33D" stroke-width="3"/>
      <text x="50" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700"
            fill="#FFFFFF" text-anchor="middle">JC</text>
    </svg>
  </div>
  <h1>JOB <span style="color:#E8A33D;">CONNECT</span></h1>
  <p>La plateforme qui connecte patrons et travailleurs</p>
  <button type="button" class="hamburger-btn" onclick="ouvrirParametres()">☰</button>
</header>
<div class="signature-divider"></div>

<div class="tabs">
  <button class="tab-btn active" onclick="allerVersEcran('accueil')">Accueil</button>
  <button class="tab-btn" onclick="allerVersEcran('depot')">📦 Dépôt</button>
  <button class="tab-btn" onclick="allerVersEcran('mon-compte')">Mon compte</button>
</div>

<!-- Paramètres -->
<div class="country-modal-overlay" id="settings-overlay" onclick="if(event.target===this) fermerParametres()">
  <div class="country-modal">
    <div class="settings-menu">
      <button class="settings-item" onclick="fermerParametres(); ouvrirSelecteurLangue();">
        <span>🌐 Langue</span>
        <span class="settings-item-value">Français</span>
      </button>
    </div>
    <button class="country-modal-close" onclick="fermerParametres()">Fermer</button>
  </div>
</div>

<!-- Sélecteur de langue -->
<div class="country-modal-overlay" id="lang-overlay" onclick="if(event.target===this) fermerSelecteurLangue()">
  <div class="country-modal">
    <div id="lang-list" style="flex: 1; overflow-y: auto; padding: 10px 0;"></div>
    <button class="country-modal-close" onclick="fermerSelecteurLangue()">Fermer</button>
  </div>
</div>

<!-- ÉCRAN ACCUEIL -->
<div class="screen active" id="screen-accueil">
  <div class="card">
    <h2>📦 DÉPÔT DE DOSSIER</h2>
    <p style="color: #666; margin-bottom: 16px;">Enregistrez votre annonce en tant que travailleur ou patron.</p>
    <button class="submit-btn" onclick="allerVersEcran('depot')">Commencer →</button>
  </div>

  <div class="card">
    <h2>Mon Compte</h2>
    <p style="color: #666; margin-bottom: 16px;">Gérez votre profil et vos annonces.</p>
    <button class="submit-btn" onclick="allerVersEcran('mon-compte')">Accéder →</button>
  </div>
</div>

<!-- ÉCRAN DÉPÔT -->
<div class="screen" id="screen-depot">
  <div class="card">
    <h2>📦 Déposer une annonce</h2>
    
    <label>Domaine</label>
    <select id="domaine">
      <option value="">-- Choisir --</option>
      <option value="IT">Informatique & Technologie</option>
      <option value="SANTE">Santé & Médecine</option>
      <option value="CONSTRUCTION">Construction & Bâtiment</option>
      <option value="TRANSPORT">Transport & Automobile</option>
      <option value="COMMERCE">Commerce & Vente</option>
      <option value="MAISON">Maison & Services</option>
    </select>

    <label style="margin-top: 16px;">Vous êtes</label>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <button class="submit-btn" style="margin: 0; background: #E7F2E9; color: #0E6E46; border: 2px solid #0E6E46;" id="btn-travailleur" onclick="selectionnerRole('travailleur')">👷 Travailleur</button>
      <button class="submit-btn" style="margin: 0; background: white; color: #333; border: 2px solid #ddd;" id="btn-patron" onclick="selectionnerRole('patron')">🏢 Patron</button>
    </div>

    <label style="margin-top: 16px;">Pays</label>
    <select id="pays">
      <option value="">-- Choisir --</option>
      <option value="RDC">RD Congo</option>
      <option value="UG">Ouganda</option>
      <option value="KE">Kenya</option>
      <option value="TZ">Tanzanie</option>
      <option value="RW">Rwanda</option>
      <option value="CM">Cameroun</option>
      <option value="SN">Sénégal</option>
    </select>

    <label style="margin-top: 16px;">Numéro WhatsApp</label>
    <input type="tel" id="telephone" placeholder="+243 975 123 456">

    <label style="margin-top: 16px;">Description (optionnel)</label>
    <textarea id="description" placeholder="Décrivez votre profil ou votre offre..."></textarea>

    <button class="submit-btn" onclick="deposerAnnonce()">Publier →</button>
    <div class="msg" id="depot-msg"></div>
  </div>

  <!-- Affichage des annonces -->
  <div id="annonces-list"></div>
</div>

<!-- ÉCRAN MON COMPTE -->
<div class="screen" id="screen-mon-compte">
  <div class="card">
    <h2>Mon Compte</h2>
    
    <label>Entrez votre numéro WhatsApp</label>
    <input type="tel" id="recherche-tel" placeholder="+243 975 123 456">
    <button class="submit-btn" onclick="rechercherCompte()">Retrouver mon compte →</button>
    <div class="msg" id="compte-msg"></div>

    <div id="compte-details" style="display: none; margin-top: 24px;">
      <div id="compte-list"></div>
    </div>
  </div>
</div>

<!-- MODAL SIGNALEMENT -->
<div class="modal-overlay" id="signal-modal" onclick="if(event.target===this) fermerSignalement()">
  <div class="modal-content">
    <button class="modal-close" onclick="fermerSignalement()">✕</button>
    <h2 style="margin-bottom: 16px; font-size: 1.1rem; color: #073C28; padding-right: 40px;">⚠️ Signaler une annonce</h2>
    
    <div style="background: #E7F2E9; padding: 12px; border-radius: 10px; margin-bottom: 20px;">
      <p style="font-size: 0.85rem; color: #666; margin-bottom: 4px;">Annonce:</p>
      <p style="font-size: 0.95rem; font-weight: 700; color: #073C28;" id="signal-annonce-nom"></p>
    </div>

    <label style="margin-bottom: 12px; display: block; font-weight: 600; color: #333;">Raison du signalement</label>
    <div id="signal-raisons" style="margin-bottom: 20px;"></div>

    <label style="display: block; margin-bottom: 8px;">Détails (optionnel)</label>
    <textarea id="signal-details" placeholder="Expliquez pourquoi vous signalez cette annonce..."></textarea>

    <button class="submit-btn" onclick="envoyerSignalement()" style="margin-top: 16px;">📤 Envoyer le signalement</button>
    <div class="msg" id="signal-msg"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, where, getDocs, doc, updateDoc, deleteDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBn2SAqVmUez262KRcZo54MVbSS512zsIg",
    authDomain: "africa-jobs-a465c.firebaseapp.com",
    projectId: "africa-jobs-a465c",
    storageBucket: "africa-jobs-a465c.firebasestorage.app",
    messagingSenderId: "59043305598",
    appId: "1:59043305598:web:458168e88ac6a8ad89e02f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Variables globales
  let roleActuel = 'travailleur';
  let signalCible = {};
  let raisonSelectionnee = '';

  // Navigation
  window.allerVersEcran = function(nom) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + nom).classList.add('active');
    
    if (nom === 'depot') chargerAnnonces();
    if (nom === 'mon-compte') document.getElementById('compte-details').style.display = 'none';
  };

  // Rôle
  window.selectionnerRole = function(role) {
    roleActuel = role;
    document.getElementById('btn-travailleur').style.background = role === 'travailleur' ? '#E7F2E9' : 'white';
    document.getElementById('btn-travailleur').style.borderColor = role === 'travailleur' ? '#0E6E46' : '#ddd';
    document.getElementById('btn-travailleur').style.color = role === 'travailleur' ? '#0E6E46' : '#333';
    
    document.getElementById('btn-patron').style.background = role === 'patron' ? '#E7F2E9' : 'white';
    document.getElementById('btn-patron').style.borderColor = role === 'patron' ? '#0E6E46' : '#ddd';
    document.getElementById('btn-patron').style.color = role === 'patron' ? '#0E6E46' : '#333';
  };

  // Déposer une annonce
  window.deposerAnnonce = async function() {
    const domaine = document.getElementById('domaine').value;
    const pays = document.getElementById('pays').value;
    const telephone = document.getElementById('telephone').value.trim();
    const description = document.getElementById('description').value.trim();

    if (!domaine || !pays || !telephone) {
      afficherMsg('depot-msg', '❌ Veuillez remplir tous les champs', 'error');
      return;
    }

    try {
      await addDoc(collection(db, 'annonces'), {
        role: roleActuel,
        domaine: domaine,
        pays: pays,
        telephone: telephone,
        description: description,
        dateCreation: serverTimestamp()
      });

      afficherMsg('depot-msg', '✅ Annonce publiée avec succès!', 'success');
      document.getElementById('domaine').value = '';
      document.getElementById('pays').value = '';
      document.getElementById('telephone').value = '';
      document.getElementById('description').value = '';

      setTimeout(() => {
        document.getElementById('depot-msg').style.display = 'none';
        chargerAnnonces();
      }, 1500);
    } catch (e) {
      afficherMsg('depot-msg', '❌ Erreur: ' + e.message, 'error');
    }
  };

  // Charger et afficher les annonces
  window.chargerAnnonces = async function() {
    const container = document.getElementById('annonces-list');
    
    try {
      const snap = await getDocs(collection(db, 'annonces'));
      
      if (snap.empty) {
        container.innerHTML = '<div class="empty-state">Aucune annonce pour le moment</div>';
        return;
      }

      let html = '<h3 style="padding: 0 16px; margin: 20px 0 10px; font-size: 1rem; color: #073C28;">📋 Annonces publiées</h3>';
      
      snap.forEach(docSnap => {
        const a = docSnap.data();
        const roleLabel = a.role === 'travailleur' ? '👷 Travailleur' : '🏢 Patron';
        const lienWhatsapp = `https://wa.me/${a.telephone.replace(/[^0-9]/g, '')}?text=Bonjour,%20je%20suis%20intéressé%20par%20votre%20annonce`;
        
        html += `
          <div class="annonce-card">
            <h3>${a.domaine} <span style="font-weight: normal; font-size: 0.85rem; color: #999;">${roleLabel}</span></h3>
            <p>🌍 ${a.pays}</p>
            <p>📞 ${a.telephone}</p>
            ${a.description ? `<p style="color: #555; margin-top: 8px;">${a.description}</p>` : ''}
            <div class="annonce-actions">
              <a href="${lienWhatsapp}" target="_blank" rel="noopener" class="annonce-btn annonce-btn-contact">💬 Contacter</a>
              <button class="annonce-btn annonce-btn-signaler" onclick="ouvrirSignalement('${docSnap.id}', '${a.domaine}')">⚠️ Signaler</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    } catch (e) {
      container.innerHTML = '<div class="empty-state">❌ Erreur: ' + e.message + '</div>';
    }
  };

  // SIGNALEMENT
  window.ouvrirSignalement = function(id, nom) {
    signalCible = { id, nom };
    raisonSelectionnee = '';
    
    document.getElementById('signal-annonce-nom').textContent = nom;
    document.getElementById('signal-details').value = '';
    document.getElementById('signal-msg').innerHTML = '';
    
    // Créer les boutons de raison
    const raisons = [
      { id: 'arnaque', label: 'Possible arnaque' },
      { id: 'spam', label: 'Spam / Publicité' },
      { id: 'contenu', label: 'Contenu offensant' },
      { id: 'donnees', label: 'Données privées exposées' },
      { id: 'autre', label: 'Autre' }
    ];
    
    let html = '';
    raisons.forEach(r => {
      html += `<button type="button" class="signal-reason-btn" onclick="selectionnerRaison('${r.id}', this)">${r.label}</button>`;
    });
    document.getElementById('signal-raisons').innerHTML = html;
    
    document.getElementById('signal-modal').classList.add('open');
  };

  window.selectionnerRaison = function(id, element) {
    raisonSelectionnee = id;
    document.querySelectorAll('.signal-reason-btn').forEach(btn => btn.classList.remove('selected'));
    element.classList.add('selected');
  };

  window.fermerSignalement = function() {
    document.getElementById('signal-modal').classList.remove('open');
    signalCible = {};
    raisonSelectionnee = '';
  };

  window.envoyerSignalement = async function() {
    if (!raisonSelectionnee) {
      afficherMsg('signal-msg', '❌ Veuillez choisir une raison', 'error');
      return;
    }

    const details = document.getElementById('signal-details').value.trim();

    try {
      await addDoc(collection(db, 'signalements'), {
        annonce_id: signalCible.id,
        annonce_nom: signalCible.nom,
        raison: raisonSelectionnee,
        details: details || 'Aucun détail fourni',
        dateSignalement: serverTimestamp()
      });

      afficherMsg('signal-msg', '✅ Signalement envoyé!', 'success');
      
      setTimeout(() => {
        window.fermerSignalement();
      }, 2000);
    } catch (e) {
      afficherMsg('signal-msg', '❌ Erreur: ' + e.message, 'error');
    }
  };

  // MON COMPTE
  window.rechercherCompte = async function() {
    const tel = document.getElementById('recherche-tel').value.trim();
    const msgDiv = document.getElementById('compte-msg');

    if (!tel) {
      afficherMsg('compte-msg', '❌ Veuillez entrer votre numéro', 'error');
      return;
    }

    try {
      const q = query(collection(db, 'annonces'), where('telephone', '==', tel));
      const snap = await getDocs(q);

      if (snap.empty) {
        afficherMsg('compte-msg', '❌ Aucune annonce trouvée', 'error');
        return;
      }

      let html = '';
      snap.forEach(docSnap => {
        const a = docSnap.data();
        html += `
          <div class="annonce-card">
            <h3>${a.domaine}</h3>
            <p>🌍 ${a.pays}</p>
            <p>📝 ${a.description || 'Aucune description'}</p>
            <div class="annonce-actions">
              <button class="annonce-btn" style="background: #E7F2E9; color: #0E6E46; flex: 1; min-width: 100px;" onclick="supprimerAnnonce('${docSnap.id}')">🗑️ Supprimer</button>
            </div>
          </div>
        `;
      });

      document.getElementById('compte-list').innerHTML = html;
      document.getElementById('compte-details').style.display = 'block';
      afficherMsg('compte-msg', `✅ ${snap.size} annonce(s) trouvée(s)`, 'success');
    } catch (e) {
      afficherMsg('compte-msg', '❌ Erreur: ' + e.message, 'error');
    }
  };

  window.supprimerAnnonce = async function(id) {
    if (!confirm('❌ Êtes-vous sûr? Cette action est irréversible.')) return;

    try {
      await deleteDoc(doc(db, 'annonces', id));
      afficherMsg('compte-msg', '✅ Annonce supprimée', 'success');
      setTimeout(() => window.rechercherCompte(), 1500);
    } catch (e) {
      afficherMsg('compte-msg', '❌ Erreur: ' + e.message, 'error');
    }
  };

  // PARAMÈTRES
  window.ouvrirParametres = function() {
    document.getElementById('settings-overlay').classList.add('open');
  };

  window.fermerParametres = function() {
    document.getElementById('settings-overlay').classList.remove('open');
  };

  window.ouvrirSelecteurLangue = function() {
    document.getElementById('lang-overlay').classList.add('open');
  };

  window.fermerSelecteurLangue = function() {
    document.getElementById('lang-overlay').classList.remove('open');
  };

  // Utilités
  function afficherMsg(id, msg, type) {
    const el = document.getElementById(id);
    el.className = 'msg ' + type;
    el.textContent = msg;
  }

  // Initialisation
  chargerAnnonces();
  selectionnerRole('travailleur');
</script>

</body>
</html>
